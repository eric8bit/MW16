name: Build MW16

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 roothide/theos
        run: |
          set -x
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" || true
          if [ ! -d "$HOME/theos/makefiles" ]; then
            echo "::warning::install-theos 没跑成，改用 git clone"
            rm -rf "$HOME/theos"
            git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos" || true

      - name: 确保有 iOS SDK
        run: |
          set -x
          mkdir -p "$HOME/theos/sdks"
          if [ -z "$(ls -A "$HOME/theos/sdks" 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks || true
            cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          fi
          ls "$HOME/theos/sdks" || true
          xcrun --sdk iphoneos --show-sdk-version || true
          clang --version || true

      - name: 编译 Stage20
        run: |
          set -o pipefail
          cd stage20-window
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee ../stage20.log

      - name: 检查产物
        if: always()
        run: |
          echo "=== deb ==="
          find . -name "*.deb" -print || true
          echo
          for f in $(find . -name "*.dylib" -path "*obj*" 2>/dev/null); do
            echo "--- $f ---"
            xcrun lipo -info "$f" 2>/dev/null || file "$f"
          done

      - name: 上传 deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MW16-debs
          path: stage20-window/packages/*.deb
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: stage20.log
          if-no-files-found: ignore
